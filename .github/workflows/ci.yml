name: Prüfen, bauen und veröffentlichen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Pakete, Tests, Berichte, Seiten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Python-Version
        run: python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version; print(sys.version)'
      # Pakete der Projekte und Paketbestand des Validators; `holen` ergänzt Fehlendes und prüft alles gegen die Sperrdatei
      - name: Paket-Cache
        uses: actions/cache@v6
        with:
          path: |
            .pakete
            .validator/.fhir/packages
          key: fhir-pakete-v2-${{ hashFiles('sperrdatei.json', 'projekte/*/projekt.toml') }}
          restore-keys: fhir-pakete-v2-
      - name: Pakete holen und gegen die Sperrdatei prüfen
        run: python3 -I werkzeuge/mx.py holen
      # Projektmuster als Secret: GitHub zeigt den Wert im Log nur maskiert (eine Variable stünde im Klartext im env-Block)
      - name: Vertraulichkeit
        env:
          VERTRAULICH_MUSTER: ${{ secrets.VERTRAULICH_MUSTER }}
        run: python3 -I werkzeuge/mx.py vertraulich
      - name: Tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Strukturprüfung der Beispiele
        run: python3 -I werkzeuge/mx.py pruefen
      - name: Seiten und Prüfberichte bauen
        run: python3 -I werkzeuge/mx.py bauen
      # Anzeige für Anwender:innen: die gebauten Seiten im Browser ohne Fenster prüfen (Chrome ist auf ubuntu-latest
      # vorinstalliert) — welche Werte der Beispiele weder Anwenderansicht noch Dokument zeigen; Ergebnis berichte/*.anzeige.json
      - name: Anzeige der Beispiele prüfen
        run: python3 -I werkzeuge/mx.py anzeige
      - name: Prüfberichte entsprechen dem eingecheckten Stand
        run: git diff --exit-code -- berichte/ sperrdatei.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ausgabe

  validieren:
    name: HL7 FHIR Validator
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VALIDATOR_VERSION: 7.0.1
      VALIDATOR_SHA256: 1178b6a3a3fe98d9cd9545cadee505274967332466001d857e4d8bed7138a5bc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Validator aus dem Cache
        id: validator
        uses: actions/cache@v6
        with:
          path: ~/.fhir/validator_cli.jar
          key: fhir-validator-${{ env.VALIDATOR_VERSION }}-${{ env.VALIDATOR_SHA256 }}
      - name: HL7 FHIR Validator holen
        if: steps.validator.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.fhir
          curl -fsSL -o ~/.fhir/validator_cli.jar \
            "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
      - name: Prüfsumme des Validators
        run: echo "${VALIDATOR_SHA256}  ${HOME}/.fhir/validator_cli.jar" | sha256sum --check --strict
      # Der Validator läuft ohne Netz und sieht nur den gesperrten Paketbestand in .validator/ (werkzeuge/mx/validieren.py)
      - name: Paket-Cache
        uses: actions/cache@v6
        with:
          path: |
            .pakete
            .validator/.fhir/packages
          key: fhir-pakete-v2-${{ hashFiles('sperrdatei.json', 'projekte/*/projekt.toml') }}
          restore-keys: fhir-pakete-v2-
      - name: Paketbestand holen und gegen die Sperrdatei prüfen
        run: python3 -I werkzeuge/mx.py holen
      - name: Beispiele validieren
        run: python3 -I werkzeuge/mx.py validieren
      # Die Prüfberichte und die Seiten bauen auf berichte/<projekt>.validierung.json auf (ohne Java):
      # das eingecheckte Ergebnis muss dem Lauf mit festem Validator, festem Paketbestand ohne Netz und englischen
      # Meldungen entsprechen.
      - name: Validierungsergebnisse entsprechen dem eingecheckten Stand
        run: git diff --exit-code -- 'berichte/*.validierung.json'
      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fhir-validierung
          path: |
            ausgabe/validierung-*.txt
            berichte/*.validierung.json
          if-no-files-found: ignore

  veroeffentlichen:
    name: Auf GitHub Pages veröffentlichen
    needs: [pruefen, validieren]
    if: github.ref == 'refs/heads/main' && vars.PAGES_FREIGEGEBEN == 'ja'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.bereitstellung.outputs.page_url }}
    steps:
      - id: bereitstellung
        uses: actions/deploy-pages@v5
