<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modellexplorer</title>
<style>
:root {
  --bg: #f6f7f9; --flaeche: #ffffff; --flaeche2: #f0f2f5; --linie: #d9dde3; --text: #1c2430; --leise: #5b6676;
  --akzent: #1f5fae; --akzent-weich: #e5eefa;
  --hl: #ffd969; --hl-text: #3a2a00; --hl2: #fff3c4; --hl2-rand: #e8b928;
  --gut: #1d7a46; --warn: #a15c00; --fehler: #b42318;
  --papier: #ffffff; --papier-text: #1c2430; --schatten: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --flaeche: #1a1f27; --flaeche2: #222833; --linie: #313947; --text: #e3e8ef; --leise: #9aa5b4;
    --akzent: #7fb0f0; --akzent-weich: #1d2b40;
    --hl: #8a6a00; --hl-text: #fff6d6; --hl2: #3a3112; --hl2-rand: #a88a2a;
    --gut: #5cc48a; --warn: #e3a64a; --fehler: #f07c70;
    --schatten: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --flaeche: #1a1f27; --flaeche2: #222833; --linie: #313947; --text: #e3e8ef; --leise: #9aa5b4;
  --akzent: #7fb0f0; --akzent-weich: #1d2b40;
  --hl: #8a6a00; --hl-text: #fff6d6; --hl2: #3a3112; --hl2-rand: #a88a2a;
  --gut: #5cc48a; --warn: #e3a64a; --fehler: #f07c70;
  --schatten: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
.kopf { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--flaeche); border-bottom: 1px solid var(--linie); }
.kopf h1 { font-size: 17px; margin: 0; font-weight: 650; }
.kopf .quelle { color: var(--leise); font-size: 12.5px; }
.kopf .startlink { color: inherit; text-decoration: none; }
.kopf .startlink:hover { text-decoration: underline; }
.beispiel-info { flex-basis: 100%; margin: 0; color: var(--leise); font-size: 12.5px; }
.abschnitt { margin: 10px 0 4px; font-weight: 650; border-bottom: 1px solid var(--linie); padding-bottom: 2px; }
.eintrag { padding: 3px 0 3px 8px; border-left: 2px solid var(--linie); margin: 3px 0; font-size: 13px; }
.eintrag .art { color: var(--leise); font-size: 11.5px; }
.leer-abschnitt { color: var(--leise); font-style: italic; font-size: 13px; }
.kopf .rechts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.knopf { border: 1px solid var(--linie); background: var(--flaeche2); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.knopf:hover { border-color: var(--akzent); }
select { border: 1px solid var(--linie); background: var(--flaeche); border-radius: 6px; padding: 4px 6px; max-width: 100%; }
.hinweis { color: var(--leise); font-size: 12.5px; }

/* Verknüpfungskette */
.kette { background: var(--flaeche); border-bottom: 1px solid var(--linie); padding: 8px 16px 10px; }
.kette-glieder { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.glied { border: 1px solid var(--linie); border-radius: 8px; padding: 6px 10px; min-height: 58px; background: var(--flaeche2); position: relative; overflow: hidden; }
.glied h3 { margin: 0 0 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--leise); font-weight: 600; }
.glied .inhalt { font-size: 13px; overflow-wrap: anywhere; max-height: 60px; overflow: auto; }
.glied.leer .inhalt { color: var(--leise); }
.glied.luecke { border-color: var(--warn); }
.glied.luecke h3::after { content: " · Lücke"; color: var(--warn); }
.kette details { margin-top: 6px; }
.kette summary { cursor: pointer; color: var(--akzent); font-size: 13px; }
.detail-raster { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 6px; max-height: 34vh; overflow: auto; }
.detail-raster section { min-width: 0; }
.detail-raster h4 { margin: 4px 0; font-size: 12px; color: var(--leise); text-transform: uppercase; letter-spacing: .04em; }
.detail-raster p { margin: 2px 0 6px; white-space: pre-line; }
.anf { border-left: 3px solid var(--akzent); padding: 2px 8px; margin: 4px 0 8px; background: var(--flaeche2); border-radius: 0 6px 6px 0; }
.anf b { font-size: 12.5px; }
.kw { font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 4px; background: var(--akzent-weich); color: var(--akzent); margin-right: 4px; }
code, .mono { font-family: var(--mono); font-size: 12px; }

/* Raster der vier Ansichten */
.raster { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.1fr) minmax(0,1fr); gap: 10px; padding: 10px 16px 16px; }
.pane { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 10px; box-shadow: var(--schatten); display: flex; flex-direction: column; min-width: 0; height: calc(100vh - var(--oben, 190px) - 26px); min-height: 360px; }
.pane > header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--linie); }
.pane > header h2 { font-size: 14px; margin: 0; font-weight: 650; }
.pane > header .nr { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--akzent); color: var(--flaeche); font-size: 12px; font-weight: 700; margin-right: 6px; }
.treffer { margin-left: auto; font-size: 12px; color: var(--leise); display: flex; gap: 6px; align-items: center; }
.treffer .zahl { background: var(--hl); color: var(--hl-text); border-radius: 10px; padding: 0 7px; font-weight: 600; }
.treffer .zahl.null { background: var(--flaeche2); color: var(--leise); }
.pane .koerper { overflow: auto; flex: 1; padding: 8px 10px; position: relative; }
.reiter { display: flex; gap: 2px; }
.reiter button { border: 1px solid var(--linie); background: var(--flaeche2); padding: 2px 9px; cursor: pointer; font-size: 12.5px; }
.reiter button:first-child { border-radius: 6px 0 0 6px; }
.reiter button:last-child { border-radius: 0 6px 6px 0; }
.reiter button[aria-selected="true"] { background: var(--akzent); color: var(--flaeche); border-color: var(--akzent); }
.unterkopf { padding: 6px 10px; border-bottom: 1px solid var(--linie); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.unterkopf input[type=search] { flex: 1; min-width: 120px; border: 1px solid var(--linie); border-radius: 6px; padding: 3px 8px; background: var(--flaeche); }
.leerhinweis { color: var(--warn); font-size: 12.5px; padding: 6px 10px; border-bottom: 1px solid var(--linie); display: none; }
.leerhinweis.an { display: block; }

/* Markierung */
[data-n], .im-zeile, [data-el] { cursor: pointer; border-radius: 3px; }
[data-n]:hover, .im-zeile:hover, .el-zeile:hover { outline: 1px dashed var(--akzent); outline-offset: 1px; }
.hl { background: var(--hl) !important; color: var(--hl-text) !important; }
.hl2 { background: var(--hl2) !important; box-shadow: inset 0 0 0 1px var(--hl2-rand); }

/* Informationsmodell */
.im-baum, .im-baum ul { list-style: none; margin: 0; padding: 0; }
.im-baum ul { padding-left: 14px; border-left: 1px dotted var(--linie); margin-left: 7px; }
.im-zeile { display: flex; gap: 4px; align-items: baseline; padding: 1px 4px; white-space: nowrap; }
.im-zeile .pfeil { width: 12px; flex: none; color: var(--leise); font-size: 10px; }
.im-zeile .name { overflow: hidden; text-overflow: ellipsis; }
.im-zeile .card { color: var(--leise); font-size: 11.5px; font-family: var(--mono); }
.im-zeile .punkt { width: 7px; height: 7px; border-radius: 50%; background: var(--gut); flex: none; align-self: center; }
.im-zeile .punkt.aus { background: transparent; border: 1px solid var(--linie); }
.im-zeile .warn { color: var(--warn); font-size: 11px; }
li.zu > ul { display: none; }
.im-zeile .art { font-size: 10px; flex: none; color: var(--akzent); }
.im-zeile .art.zyk { color: var(--warn); font-size: 12px; }
.im-zeile .art.fhir { border: 1px solid var(--linie); border-radius: 3px; padding: 0 3px; color: var(--leise); }
.im-zeile.syn .name { font-style: italic; color: var(--leise); }
.knopf.mini { padding: 0 6px; font-size: 12px; line-height: 18px; }
.fehlerliste td:first-child { white-space: nowrap; }
.detail-raster section.voll { grid-column: 1 / -1; }
.term-wrap { max-height: 240px; overflow: auto; border: 1px solid var(--linie); border-radius: 6px; margin: 4px 0 8px; }
.term-tab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.term-tab th { position: sticky; top: 0; background: var(--flaeche2); text-align: left; font-weight: 600; color: var(--leise); padding: 3px 8px; border-bottom: 1px solid var(--linie); }
.term-tab td { padding: 2px 8px; border-bottom: 1px solid var(--linie); vertical-align: top; }
.term-tab tr.belegt td { background: var(--hl2); }
.werteliste { margin: 2px 0; }
li.versteckt { display: none; }

/* Profil */
table { border-collapse: collapse; width: 100%; }
.el-tab td { padding: 2px 4px; border-bottom: 1px solid var(--linie); vertical-align: top; font-size: 12.5px; }
.el-tab td.id { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.el-tab td.card { font-family: var(--mono); font-size: 12px; color: var(--leise); white-space: nowrap; }
.el-tab .ms { color: var(--fehler); font-weight: 700; font-size: 11px; }
.el-tab .im { font-size: 10px; border: 1px solid var(--gut); color: var(--gut); border-radius: 3px; padding: 0 3px; }
.el-tab tr.diff td.id { font-weight: 650; }
.el-tab .kurz { color: var(--leise); }
.el-tab { table-layout: fixed; }
.el-tab td { overflow-wrap: anywhere; }
.el-tab td.id { overflow: hidden; text-overflow: ellipsis; }
.el-tab td.typ .mono { word-break: break-word; }
.profilinfo { font-size: 12px; color: var(--leise); margin-bottom: 6px; }

/* Instanz */
.res { margin-bottom: 8px; border: 1px solid var(--linie); border-radius: 6px; }
.res > summary { padding: 3px 8px; background: var(--flaeche2); cursor: pointer; font-size: 12.5px; border-radius: 6px; }
.res > summary .profil { color: var(--leise); }
.json { font-family: var(--mono); font-size: 12px; padding: 4px 8px; white-space: pre; overflow-x: auto; }
.json .s { color: var(--gut); } .json .z { color: var(--akzent); } .json .k { color: var(--leise); }

/* Anwenderansicht */
.pvs { font-size: 13.5px; }
.pvs .titel { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.pvs .titel h3 { margin: 0; font-size: 16px; }
.etikett { font-size: 11.5px; padding: 1px 7px; border-radius: 10px; background: var(--akzent-weich); color: var(--akzent); font-weight: 600; }
.etikett.rot { background: #fde4e1; color: #a2271b; }
.kv { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 2px 10px; margin-bottom: 10px; font-size: 13px; }
.kv dt { color: var(--leise); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.erg td, .erg th { padding: 4px 6px; border-bottom: 1px solid var(--linie); text-align: left; font-size: 13px; vertical-align: top; }
.erg th { font-size: 11.5px; color: var(--leise); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.erg tr.bereich td { background: var(--flaeche2); font-weight: 650; }
.erg tr.gruppe td { font-weight: 600; color: var(--akzent); padding-top: 8px; }
.erg td.wert { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.erg .loinc { color: var(--leise); font-family: var(--mono); font-size: 11px; }
.flag { font-weight: 700; } .flag.H, .flag.HH { color: var(--fehler); } .flag.L, .flag.LL { color: #2563eb; } .flag.N { color: var(--gut); font-weight: 500; }
.notiz { background: var(--flaeche2); border-radius: 6px; padding: 6px 8px; margin-top: 8px; font-size: 13px; }

/* Dokument */
.papier { background: var(--papier); color: var(--papier-text); box-shadow: 0 1px 4px rgba(0,0,0,.25); padding: 26px 28px; max-width: 620px; margin: 4px auto 12px; font-family: Georgia, "Times New Roman", serif; font-size: 12.5px; aspect-ratio: auto; }
.papier h4 { font-family: system-ui, sans-serif; margin: 0; font-size: 15px; }
.papier .brief { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.papier .anschrift { font-size: 12px; }
.papier .klein { font-size: 10.5px; color: #555; }
.papier table td, .papier table th { border-bottom: 1px solid #ccc; padding: 3px 4px; text-align: left; font-size: 12px; }
.papier table th { font-family: system-ui, sans-serif; font-size: 10.5px; color: #444; }
.papier .fuss { margin-top: 18px; border-top: 1px solid #999; padding-top: 6px; font-size: 10.5px; color: #444; }
.papier .hl, .papier .hl2 { color: #3a2a00 !important; }
.papier .hl { background: #ffd969 !important; } .papier .hl2 { background: #fff3c4 !important; }
.pdfzeile { font-family: Helvetica, Arial, sans-serif; font-size: 13px; padding: 2px 0; }
.pdfzeile.ohne { color: #888; }

dialog { border: 1px solid var(--linie); border-radius: 10px; background: var(--flaeche); color: var(--text); max-width: 920px; width: calc(100% - 32px); max-height: 86vh; padding: 0; }
dialog .innen { padding: 14px 18px; overflow: auto; max-height: 80vh; }
dialog h2 { margin: 0 0 8px; font-size: 17px; }
dialog table td, dialog table th { border-bottom: 1px solid var(--linie); padding: 3px 6px; text-align: left; font-size: 12.5px; vertical-align: top; }
dialog::backdrop { background: rgba(0,0,0,.35); }

@media (max-width: 1500px) {
  .raster { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .pane { height: 70vh; }
}
@media (max-width: 860px) {
  .raster { grid-template-columns: minmax(0,1fr); padding: 10px 16px; }
  .kette-glieder { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .detail-raster { grid-template-columns: minmax(0,1fr); }
  .pane { height: 75vh; }
  .kopf .rechts { margin-left: 0; }
}
</style>
</head>
<body>
<header class="kopf">
  <h1><a href="index.html" class="startlink" title="Alle Projekte">Modellexplorer</a> · <span id="projekt-titel"></span></h1>
  <span class="quelle" id="quelle"></span>
  <div class="rechts">
    <label class="hinweis" for="beispielwahl">Beispiel</label>
    <select id="beispielwahl"></select>
    <button class="knopf" id="pruefung-auf">Abdeckung &amp; Prüfung</button>
    <button class="knopf" id="leeren" title="Auswahl aufheben (Esc; Esc schließt zuerst offene Fenster)">Auswahl aufheben</button>
  </div>
  <p class="beispiel-info" id="beispiel-info"></p>
</header>

<section class="kette" id="kette" aria-live="polite">
  <div class="kette-glieder">
    <div class="glied leer" id="g-im"><h3 id="g-im-titel">1 Informationsmodell</h3><div class="inhalt">Element in einer der vier Ansichten anklicken.</div></div>
    <div class="glied leer" id="g-fhir"><h3>2 FHIR-Profil</h3><div class="inhalt">–</div></div>
    <div class="glied leer" id="g-inst"><h3>Instanz</h3><div class="inhalt">–</div></div>
    <div class="glied leer" id="g-sicht"><h3>3 Ansicht · 4 Dokument</h3><div class="inhalt">–</div></div>
  </div>
  <details id="details"><summary>Beschreibung, Codes, Herkunft und Anforderungen</summary><div class="detail-raster" id="detail-raster"></div></details>
</section>

<main class="raster">
  <section class="pane" id="p-im">
    <header><h2><span class="nr">1</span><span id="im-titel">Informationsmodell</span></h2><span class="treffer" id="t-im"></span></header>
    <div class="leerhinweis an" id="im-hinweis" hidden></div>
    <div class="unterkopf"><div class="reiter" id="varianten" role="tablist" aria-label="Darstellung des Informationsmodells"><button role="tab" data-variante="referenziert" aria-selected="true" title="wie im IG: Profile stehen einmal und werden referenziert">referenziert</button><button role="tab" data-variante="ausmodelliert" aria-selected="false" title="jede Referenz an der Stelle ausmodelliert, an der sie vorkommt">ausmodelliert</button></div><input type="search" id="im-suche" placeholder="Element suchen …" aria-label="Informationsmodell durchsuchen"><button class="knopf" id="im-auf" title="Alle aufklappen">+</button><button class="knopf" id="im-zu" title="Alle zuklappen">–</button></div>
    <div class="koerper"><ul class="im-baum" id="im-baum"></ul></div>
  </section>

  <section class="pane" id="p-fhir">
    <header><h2><span class="nr">2</span>FHIR</h2>
      <div class="reiter" role="tablist"><button role="tab" data-reiter="profil" aria-selected="true">Profil</button><button role="tab" data-reiter="instanz" aria-selected="false">Instanz</button></div>
      <span class="treffer" id="t-fhir"></span></header>
    <div class="unterkopf" id="profilwahl-zeile"><select id="profilwahl" aria-label="Profil wählen"></select><a id="profil-link" class="hinweis" target="_blank" rel="noopener">im IG</a></div>
    <div class="leerhinweis" id="lh-fhir"></div>
    <div class="koerper" id="fhir-koerper"></div>
  </section>

  <section class="pane" id="p-ui">
    <header><h2><span class="nr">3</span>Anwenderansicht</h2><span class="hinweis" id="ui-untertitel"></span><span class="treffer" id="t-ui"></span></header>
    <div class="leerhinweis" id="lh-ui"></div>
    <div class="koerper" id="ui-koerper"></div>
  </section>

  <section class="pane" id="p-doc">
    <header><h2><span class="nr">4</span>Dokument</h2>
      <div class="reiter" role="tablist" id="doc-reiter"></div>
      <span class="treffer" id="t-doc"></span></header>
    <div class="leerhinweis" id="lh-doc"></div>
    <div class="koerper" id="doc-koerper"></div>
  </section>
</main>

<dialog id="pruefung"><div class="innen" id="pruefung-innen"></div></dialog>

<script>
const D = /*DATEN*/null;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kurzUrl = u => (u || '').split('/').pop();

// ------------------------------------------------------------------ Elementlogik
// Kanonische Kennung: Profil-URL + '#' + Elementpfad mit Slices, Typwahl als JSON-Name (valueQuantity).
function teile(k) { return k.split('.').map(s => { const i = s.indexOf(':'); return i < 0 ? [s, ''] : [s.slice(0, i), s.slice(i + 1)]; }); }
function deckt(a, b) {               // a umfasst b (gleich oder Vorfahr)
  const ta = teile(a), tb = teile(b);
  if (ta.length > tb.length) return false;
  for (let i = 0; i < ta.length; i++) {
    const [na, sa] = ta[i], [nb, sb] = tb[i];
    if (na.endsWith('[x]')) { const s = na.slice(0, -3); if (!(nb.startsWith(s) && /^[A-Z]/.test(nb.slice(s.length)))) return false; }
    else if (na !== nb) return false;
    if (sa && sb && sa !== sb) return false;
  }
  return true;
}
const tiefe = k => k.split('.').length;
const guete = k => tiefe(k) * 10 + (k.match(/:/g) || []).length;   // tiefer und mit Slice = spezifischer
const trenne = el => { const i = el.indexOf('#'); return [el.slice(0, i), el.slice(i + 1)]; };

// ------------------------------------------------------------------ Zustand
let B = null;                 // aktuelles Beispiel
let RES = {}, URL2KEY = {};   // Ressourcen
let KNOTEN = [];              // [{nid, sd, k}]
let auswahl = null;
const IM = D.im, IMBYID = {}, IMKIDS = {};
IM.forEach(n => { IMBYID[n.id] = n; (IMKIDS[n.p || '#'] ||= []).push(n.id); });
const IMMAPS = IM.flatMap(n => n.maps.filter(m => m.sd).map(m => ({ im: n.id, sd: m.sd, k: m.k })));

function beispielLaden(id) {
  B = D.beispiele.find(b => b.id === id) || D.beispiele[0];
  $('#beispielwahl').value = B.id;
  $('#beispiel-info').innerHTML = `<b>Zweck:</b> ${esc(B.zweck)} · <b>Herkunft:</b> ${esc(B.herkunft)}`;
  try { history.replaceState(null, '', '#' + B.id); } catch (e) { /* lokal ohne Verlauf */ }
  RES = {}; URL2KEY = {};
  B.ressourcen.forEach(r => { RES[r.key] = r; URL2KEY[r.fullUrl] = r.key; URL2KEY[r.key] = r.key; });
  KNOTEN = Object.entries(B.elemente).map(([nid, el]) => { const [sd, k] = trenne(el); return { nid, sd, k }; });
  imBelegungBerechnen();
}
function verweis(ref) {

  const fhirTeil = R.el.slice(0, 2).map(({ sd, k }) => { const p = D.profile[sd]; const e = p?.elemente.find(x => x.k === k); return e ? `<h4>FHIR: ${esc(p.name)}</h4><p><code>${esc(e.id)}</code> ${esc(e.card)}${e.ms ? ' · Must Support' : ''}</p><p>${esc(e.short)}</p>${e.bindung ? `<p class="werteliste">Bindung: ${wertelisteHtml(e.bindung)}</p>` : (e.bind ? `<p class="hinweis">Bindung: ${esc(e.bind)}</p>` : '')}${e.fest ? `<p class="hinweis mono">${esc(e.fest)}</p>` : ''}${e.def ? `<p class="hinweis">${esc(e.def)}</p>` : ''}` : `<h4>FHIR: ${esc(p ? p.name : kurzUrl(sd))}</h4><p><code>${esc(k)}</code> — kein Element im Profil-Snapshot (siehe Mappingprüfung)</p>`; }).join('');
  const anf = anforderungenFuer(R);
  const imAnf = ims.flatMap(n => n.anf);
  const anfTeil = (imAnf.length || anf.length) ? '<h4>Anforderungen</h4>'
    + imAnf.map(a => `<div class="anf"><span class="kw">${esc(a.kw)}</span><b>${esc(a.titel)}</b> <span class="hinweis">· aus dem Informationsmodell · ${esc(a.akteur)}</span><p>${esc(a.text)}</p></div>`).join('')
    + anf.map(a => `<div class="anf"><span class="kw">${esc(a.conf)}</span><b>${esc(a.key)}</b> ${esc(a.titel)} <span class="hinweis">· Verarbeitungsregeln, ${esc(a.abschnitt)}</span><p>${esc(a.text)}</p></div>`).join('')
    : '<h4>Anforderungen</h4><p class="hinweis">Keine Anforderung mit Bezug auf dieses Element gefunden.</p>';
  const gesehen = new Set();   // gleiche Terminologie an mehreren Modellelementen nur einmal zeigen
  const termTeil = ims.slice(0, 3).filter(n => { const k = JSON.stringify([n.terminologie, n.wertelisten]); if (gesehen.has(k)) return false; gesehen.add(k); return true; })
    .map(terminologieHtml).join('');
  $('#detail-raster').innerHTML = `<section>${imTeil || '<p class="hinweis">Kein Element im Informationsmodell.</p>'}</section><section>${fhirTeil || '<p class="hinweis">Kein Profilelement.</p>'}</section><section>${anfTeil}</section>`
    + (termTeil ? `<section class="voll">${termTeil}</section>` : '');
}
const CODESYSTEME = { 'http://snomed.info/sct': 'SNOMED CT', 'http://loinc.org': 'LOINC', 'http://unitsofmeasure.org': 'UCUM' };
function wertelisteHtml(w) {
  if (!w) return '';
  const name = esc(w.name || w.titel || kurzUrl(w.url));
  const titel = w.titel && w.titel !== w.name ? ` <span class="hinweis">— ${esc(w.titel)}</span>` : '';
  const ziel = w.seite ? `<a href="${esc(w.seite)}" target="_blank" rel="noopener" title="${esc(w.url || '')}">${name}</a>` : name;
  const herkunft = w.paket ? `<span class="hinweis">· ${esc(w.paket)}</span>`
    : (w.seite ? '<span class="hinweis">· kanonische URL</span>' : '<span class="warn">· nicht im Paketbestand</span>');
  return `${ziel}${titel} ${w.staerke ? `<span class="kw">${esc(w.staerke)}</span>` : ''} ${herkunft}`;
}
function terminologieHtml(n) {
  const zeilen = n.terminologie || [], wl = n.wertelisten || [];
  if (!zeilen.length && !wl.length) return '';
  const spalten = [['konzept', 'Konzept'], ['code', 'Code'], ['display', 'Anzeige'], ['designations', 'Bezeichnungen'],
    ['filter', 'Filter'], ['system', 'Codesystem']].filter(([f]) => zeilen.some(z => z[f]));
  const mitVs = wl.length > 1;
  const belegt = new Map();
  for (const kn of KNOTEN) { const w = wert(...kn.nid.split('|')); if (typeof w === 'string' && !belegt.has(w)) belegt.set(w, kn.nid); }
  const zelle = (z, f) => {
    if (f === 'code') return z.code ? `<code>${esc(z.code)}</code>${belegt.has(z.code) ? ` <a href="#" data-sprung="${esc(belegt.get(z.code))}">im Beispiel</a>` : ''}` : '';
    if (f === 'system') return `<span title="${esc(z.system)}">${esc(CODESYSTEME[z.system] || kurzUrl(z.system))}</span>`;
    return esc(z[f]);
  };
  const kopf = `<tr>${spalten.map(([, t]) => `<th>${t}</th>`).join('')}${mitVs ? '<th>Werteliste</th>' : ''}</tr>`;
  const sortiert = [...zeilen].sort((a, b) => (belegt.has(b.code) ? 1 : 0) - (belegt.has(a.code) ? 1 : 0));   // im Beispiel belegte Codes zuerst
  const rumpf = sortiert.map(z => `<tr class="${z.code && belegt.has(z.code) ? 'belegt' : ''}">${spalten.map(([f]) => `<td>${zelle(z, f)}</td>`).join('')}${mitVs ? `<td>${z.vs !== null && z.vs !== undefined ? esc(wl[z.vs].name) : ''}</td>` : ''}</tr>`).join('');
  return `<h4>Terminologie: ${esc(n.name)}</h4>`
    + wl.map(w => `<p class="werteliste">Werteliste: ${wertelisteHtml(w)}</p>`).join('')
    + (zeilen.length ? `<div class="term-wrap"><table class="term-tab"><thead>${kopf}</thead><tbody>${rumpf}</tbody></table></div>`
      + `<p class="hinweis">${zeilen.length} Einträge${zeilen.some(z => z.code && belegt.has(z.code)) ? ' · hinterlegt und oben: im Beispiel belegt' : ''}</p>` : '');
}

// ------------------------------------------------------------------ Prüfbericht
const TECHNISCH = /\.(url|reference|system|version)$|\.text\.(div|status)$/;   // technische Angaben ohne eigenes fachliches Gegenstück
function pruefungZeigen() {
  const s = D.statistik, ab = B.abdeckung;
  const ohneIm = new Map();
  for (const kn of KNOTEN) {
    const w = wert(...kn.nid.split('|')); if (w !== null && typeof w === 'object') continue;
    if (TECHNISCH.test(kn.k)) continue;
    if (!IMMAPS.some(m => m.sd === kn.sd && m.k.includes('.') && deckt(m.k, kn.k))) { const k = kurzUrl(kn.sd) + ' · ' + kn.k; ohneIm.set(k, (ohneIm.get(k) || 0) + 1); }
  }
  const imOhne = IM.filter(n => !n.maps.length && !(IMKIDS[n.id] || []).length && !n.name.endsWith('(Referenz)'));
  const st = s.mapping_status, ba = s.baum_aus;
  const liste = (stati) => D.pruefung.filter(p => stati.includes(p.status)).map(p => `<tr><td>${esc(p.im)}<br><span class="hinweis">${esc(p.pfad.split(' / ').slice(-3, -1).join(' / '))}</span></td><td><code>${esc(p.mapping)}</code><br>${esc(p.grund).replace(/`([^`]+)`/g, '<code>$1</code>')}</td></tr>`).join('');
  const gematik = D.meta.im_art === 'gematik-baum', ig = D.meta.ig;
  const zeile = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  $('#pruefung-innen').innerHTML = `<h2>Abdeckung und ${gematik ? 'Mappingprüfung' : 'Strukturprüfung'}</h2>
    <p class="hinweis">Maschinell aus den veröffentlichten Artefakten abgeleitet. Bewertungen sind Hinweise, keine Feststellungen.</p>
    <p class="hinweis">Quellen: ${esc(ig.name)} (<code>${esc(ig.paket)}</code>, ${esc(ig.status)})${ig.url ? `, <a href="${esc(ig.url)}" target="_blank" rel="noopener">IG</a>` : ''} · Beispiel: ${esc(B.herkunft)}</p>
    ${D.meta.im_hinweis ? `<p class="hinweis">${esc(D.meta.im_hinweis)}</p>` : ''}
    <table><tbody>
      ${gematik ? zeile('Elemente im Informationsmodell', `${s.im_knoten}, davon ${s.im_mit_mapping} mit FHIR-Mapping`)
        + zeile('FHIR-Mappings', `${s.mappings}: ${st.exakt} exakt · ${st.gleichwertig || 0} gleichwertig geschrieben · ${st.schreibvariante} in gemischter Notation · <b>${st.fehler} ohne Ziel · ${st.verboten} auf ein 0..0-Element</b> · ${s.anderes_profil} in ein anderes Profil als das übergeordnete Element`)
        : zeile('Abgeleitete Struktur', `${s.im_knoten} Elemente aus den Profilen`)}
      ${ba ? zeile('Ausmodellierte Darstellung', `${ba.knoten} Knoten · ${ba.ausmodelliert} Referenzen an Ort und Stelle aufgelöst · ${ba.zyklen} Zyklen erkannt · ${ba.aus_profil} Knoten aus FHIR-Profilen ergänzt (Must Support)`) : ''}
      ${s.wertelisten && s.wertelisten.gesamt ? zeile('Wertelisten im Modell', `${s.wertelisten.gesamt}, davon ${s.wertelisten.aufgeloest} im Paketbestand oder über eine Profilbindung aufgelöst, ${s.wertelisten.mit_link} mit Link auf die Originalseite${s.wertelisten.ohne.length ? ' · nicht auflösbar: ' + s.wertelisten.ohne.map(esc).join(', ') : ''}`) : ''}
      ${s.anforderungen || s.im_anforderungen ? zeile('Anforderungen', `${s.anforderungen} in den Verarbeitungsregeln, davon ${s.anforderungen_mit_pfad} mit erkennbarem Elementpfad; ${s.im_anforderungen} direkt im Informationsmodell`) : ''}
      ${zeile(esc(B.titel), `${B.ressourcen.length} Ressourcen · ${ab.werte} fachliche Einzelwerte, davon ${ab.gedeckt} durch ein spezifisches Element ${gematik ? 'des Informationsmodells' : 'der abgeleiteten Struktur'} gedeckt · ${B.struktur.length} Strukturbefunde`)}
    </tbody></table>
    ${B.struktur.length ? '<h3>Strukturbefunde im Beispiel</h3><p class="hinweis">Belegtes Element, das sich im Profil nicht auflösen lässt.</p><table class="fehlerliste"><tbody>' + B.struktur.map(x => zeile(`<code>${esc(x.element)}</code>`, esc(x.grund))).join('') + '</tbody></table>' : ''}
    ${s.bindungsabgleich && Object.keys(s.bindungsabgleich.zaehlung || {}).length ? `<h3>Werteliste im Modell gegen Bindung im Profil</h3>
    <p class="hinweis">Je Mapping: Bindung am Element, am CodeableConcept, am Wert einer Extension oder an einem Slice darunter. ${Object.entries(s.bindungsabgleich.zaehlung).map(([k, v]) => `${esc(k)}: <b>${v}</b>`).join(' · ')}</p>
    <table class="fehlerliste"><tbody>${[...s.bindungsabgleich.slice.map(x => zeile(esc(x.im) + `<br><code>${esc(x.mapping)}</code>`, `<span class="warn">Mapping präzisieren</span> → <code>${esc(x.vorschlag)}</code> (Werteliste <code>${esc(x.modell)}</code> ist dort gebunden)`)),
      ...s.bindungsabgleich.abweichend.map(x => zeile(esc(x.im) + `<br><code>${esc(x.mapping)}</code>`, `<span class="warn">abweichend</span> Modell <code>${esc(x.modell)}</code>, Profil <code>${esc(x.profil)}</code> (${esc(x.staerke_profil)}, ${esc(x.wo)})`)),
      ...s.bindungsabgleich.ungeklaert.map(x => zeile(esc(x.im) + `<br><code>${esc(x.mapping)}</code>`, `ungeklärt: Modell <code>${esc(x.modell)}</code> nicht im Paketbestand, Profil <code>${esc(x.profil)}</code> (${esc(x.staerke_profil)}, ${esc(x.wo)})`))].join('')}</tbody></table>` : ''}
    ${gematik ? `<h3>Fehlerhafte Mappings</h3><p class="hinweis">Pfad führt auf kein Element oder auf ein im Profil verbotenes.</p>
    <table class="fehlerliste"><tbody>${liste(['fehler', 'verboten', 'unbekannt'])}</tbody></table>
    <h3>Mapping in ein anderes Profil</h3><p class="hinweis">Kann gewollt sein (Device/DeviceDefinition); zu prüfen.</p>
    <table class="fehlerliste"><tbody>${liste(['anderes-profil'])}</tbody></table>
    <details><summary>Schreibvarianten (${st.schreibvariante}) — gemischte Notation, vereinheitlichen</summary>
    <table class="fehlerliste"><tbody>${liste(['schreibvariante'])}</tbody></table></details>
    <details><summary>Gleichwertige Schreibweisen (${st.gleichwertig || 0}) — JSON-Name der Typwahl oder Typ-Slice, keine Korrektur nötig</summary>
    <table class="fehlerliste"><tbody>${liste(['gleichwertig'])}</tbody></table></details>` : ''}
    <h3>Werte im Beispiel ohne spezifisches Element ${gematik ? 'im Informationsmodell' : 'in der abgeleiteten Struktur'}</h3><p class="hinweis">Ohne technische Angaben (url, reference, system, version, Erzähltext).</p>
    <table><tbody>${[...ohneIm].sort().map(([k, n]) => `<tr><td><code>${esc(k)}</code></td><td>${n}×</td></tr>`).join('')}</tbody></table>
    ${gematik ? `<h3>Blätter im Informationsmodell ohne FHIR-Mapping (${imOhne.length})</h3><p>${imOhne.map(n => esc(n.name)).join(' · ')}</p>` : ''}
    <p><button class="knopf" onclick="this.closest('dialog').close()">Schließen</button></p>`;
  $('#pruefung').showModal();
}

// ------------------------------------------------------------------ Ereignisse
function waehlen(sel) { auswahl = sel; fundZeiger = null; markieren(); }
document.addEventListener('click', e => {
  const sprung = e.target.closest('[data-sprung]');
  if (sprung) { e.preventDefault(); return waehlen({ t: 'node', nids: [sprung.dataset.sprung] }); }
  const fund = e.target.closest('[data-fund]');
  if (fund) { const n = FUNDE.length; fundZeiger = ((fundZeiger ?? (+fund.dataset.fund > 0 ? -1 : 0)) + +fund.dataset.fund + n) % n; return markieren(); }
  const pfeil = e.target.closest('.pfeil');
  if (pfeil && pfeil.textContent) { const li = pfeil.closest('li'); imAufklappen(li, li.classList.contains('zu')); return; }
  const zl = e.target.closest('.im-zeile[data-u]');
  if (zl) {
    const b = T.k[zl.dataset.u];
    if (b.y) { if (!b.el) return; const [sd, k] = trenne(b.el); return waehlen({ t: 'el', sd, k, u: b.u }); }
    return waehlen({ t: 'im', id: b.z || b.s, u: b.u });
  }
  const el = e.target.closest('[data-el]'); if (el) { const [sd, k] = trenne(el.dataset.el); return waehlen({ t: 'el', sd, k }); }
  const n = e.target.closest('[data-n]');
  if (n) { e.preventDefault(); return waehlen({ t: 'node', nids: n.dataset.n.split(' ') }); }
});
// Escape schließt von innen nach außen: Prüfdialog, dann die aufgeklappten Details, dann die Auswahl
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const dialog = $('#pruefung');
  if (dialog.open) { e.preventDefault(); dialog.close(); return; }
  if ($('#details').open) { $('#details').open = false; obenMessen(); return; }
  waehlen(null);
});
$('#leeren').onclick = () => waehlen(null);
$('#pruefung-auf').onclick = pruefungZeigen;
$('#profilwahl').onchange = e => { profilAktiv = e.target.value; profilZeichnen(); markieren(false); };
$$('[data-reiter]').forEach(b => b.onclick = () => { reiter = b.dataset.reiter; fhirZeichnen(); markieren(); });
$('#doc-reiter').innerHTML = D.meta.dokumente.map(d => `<button role="tab" data-doc="${d}" aria-selected="false">${DOKUMENTE[d]}</button>`).join('');
$$('[data-doc]').forEach(b => b.onclick = () => { docReiter = b.dataset.doc; docZeichnen(); markieren(); });
$('#beispielwahl').onchange = e => { beispielLaden(e.target.value); alles(); waehlen(null); };
$('#im-auf').onclick = () => { let zu; while ((zu = $$('#im-baum li.zu')).length && $$('#im-baum li').length < 5000) zu.forEach(li => imAufklappen(li, true)); };
$('#im-zu').onclick = () => $$('#im-baum li').forEach(li => imAufklappen(li, false));
$$('[data-variante]').forEach(b => b.onclick = () => {
  variante = b.dataset.variante; try { localStorage.setItem('modellexplorer.variante', variante); } catch (e) { /* ohne Speicher */ }
  filter = null; $('#im-suche').value = ''; fundZeiger = null; imBaumBauen(); markieren();
});
$('#im-suche').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  filter = null;
  if (q) {
    T = baumIndex(variante); filter = new Set(); let treffer = 0;
    for (const b of VARIANTEN[variante]) {
      if (treffer >= 150) break;
      if (knotenName(b).toLowerCase().includes(q) || (b.s && IMBYID[b.s].maps.some(m => (m.roh || '').toLowerCase().includes(q)))) {
        treffer++; let x = b; while (x && !filter.has(x.u)) { filter.add(x.u); x = x.p ? T.k[x.p] : null; }
      }
    }
  }
  imBaumBauen(); markieren(false);
};
function obenMessen() { document.documentElement.style.setProperty('--oben', ($('.kopf').offsetHeight + $('#kette').offsetHeight) + 'px'); }
new ResizeObserver(obenMessen).observe($('#kette'));
window.addEventListener('resize', obenMessen);

function alles() { imBaumBauen(); profilWahlBauen(); fhirZeichnen(); (D.meta.darstellung === 'laborbefund' ? uiZeichnen : dokumentAnsichtZeichnen)(); docZeichnen(); }
$('#projekt-titel').textContent = D.meta.titel;
$('#quelle').textContent = `${D.meta.ig.name} · ${D.meta.ig.paket} (${D.meta.ig.status})`;
$('#im-titel').textContent = D.meta.im_titel; $('#g-im-titel').textContent = '1 ' + D.meta.im_titel;
if (D.meta.im_hinweis) { $('#im-hinweis').hidden = false; $('#im-hinweis').textContent = D.meta.im_hinweis; }
if (!D.baum_aus) { $('#varianten').hidden = true; variante = 'referenziert'; }
$('#ui-untertitel').textContent = D.meta.darstellung === 'laborbefund' ? 'Primärsystem, Befundeingang' : 'Primärsystem, Dokument geöffnet';
$('#beispielwahl').innerHTML = D.beispiele.map(b => `<option value="${esc(b.id)}" title="${esc(b.zweck)}">${esc(b.titel)}</option>`).join('');
beispielLaden(decodeURIComponent(location.hash.slice(1))); alles(); markieren(false); obenMessen();
</script>
</body>
</html>
