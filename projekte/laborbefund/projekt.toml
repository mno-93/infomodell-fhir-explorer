# HL7 FHIR Validator: nur Beispieldateien (die Paketbeispiele prüft der IG-Build)
[validierung]
# Paketstand wie im Demo-PVS, aus dem die Beispiele stammen (dort ohne Fehler bis auf die Ausnahmen)
pakete = [
  "hl7.fhir.uv.extensions.r4#5.3.0",
  "de.basisprofil.r4#1.6.0",
  "hl7.fhir.eu.base#2.0.1",
  "de.gematik.ti#1.5.0-ballot.2",
  "de.gematik.epa.laboratory#1.0.0-ballot.1",
  "de.gematik.terminology#1.1.0-ballot.2",
]
# Demo-Erweiterungen der Beispiele (Namensraum example.org) zulassen
erweiterungen = ["https://example.org/"]

[[validierung.ausnahmen]]
muster = "Constraint failed: dr-comp-identifier:"
grund = "Profilkonflikt im Ballot: Bundle-eu-lab verlangt eine DiagnosticReport-Kennung gleich Composition.identifier; composition-dglp verbietet identifier.type, diagnostic-report-dglp verlangt ihn bei geschlossenem Slicing — mit keiner Instanz erfüllbar."

[[validierung.ausnahmen]]
muster = "Slice 'Composition\\.section:result': a matching slice is required|Unable to find a profile match for Composition/comp-[0-9a-f]{8} among choices"
grund = "Ohne Terminologieserver nicht auswertbar: composition-dglp ordnet den Abschnitt über eine required-Bindung an lab-studyType-eu-lab (LOINC) zu; der Validator verneint die Zugehörigkeit ohne Server. Dazu Folgefehler am Verweis auf die Composition."
