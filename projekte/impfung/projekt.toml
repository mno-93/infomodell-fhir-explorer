# Impfung (Entwurf, EU-konform) — Studie eines Impfeintrags nach HL7 Europe Base (EU Core) mit den
# Pflichtangaben der EU Patient Summary. Profile als FSH im Projekt (fsh/), Paket eingecheckt (paket/).
id = "impfung"
titel = "Impfung (Entwurf, EU-konform)"
beschreibung = "Studie eines Impfeintrags nach EU Core: Impfprofil und Impfstoffprodukt als Entwurf (FSH im Projekt), zwei fiktive Patient-Summary-Dokumente nach HL7 EU EPS — Erstdokumentation und Nachtrag aus einem Papier-Impfpass."
darstellung = "dokument"
dokumente = ["erzaehltext"]

# Lokales Paket im Projektordner (package/package.json + Ressourcen); Vorrang vor allen anderen Paketen.
# `holen` und die Sperrdatei überspringen es; neu erzeugen mit `python3 -I werkzeuge/mx.py fsh impfung`.
lokale_pakete = ["paket"]

pakete = [
  "hl7.fhir.eu.eps#1.0.0-ballot",
  "hl7.fhir.eu.base#2.0.1",
  "hl7.fhir.uv.ips#2.0.1",
  "hl7.fhir.eu.extensions.r4#1.3.1",
  "hl7.fhir.uv.xver-r5.r4#0.1.0",
  "hl7.fhir.uv.extensions.r4#5.3.0",
  "de.gematik.epa#1.4.0-ballot.1",
  "de.gematik.ti#1.5.0-ballot.2",
  "de.basisprofil.r4#1.6.0",
  "hl7.fhir.r4.core#4.0.1",
]

# Nur für die Auflösung von Wertelisten der Bindungen
terminologiepakete = [
  "hl7.terminology.r4#7.3.0",
]

# Logikmodelle für die Prüfung der EHDS-Mappings des Informationsmodells
logikmodellpakete = [
  "xtehr.eu.ehds.models#1.0.0",
]

[fsh]
quelle = "fsh"
paket = "paket"

[ig]
name = "Entwurf (nicht veröffentlicht) — Grundlagen: HL7 Europe Base 2.0.1, HL7 Europe Patient Summary 1.0.0-ballot"
paket = "example.impfung.entwurf#0.1.0"
status = "Entwurf, nicht veröffentlicht"

[standardprofile]
Immunization = "https://example.org/fhir/impfung-entwurf/StructureDefinition/ps-immunization"
Medication = "https://example.org/fhir/impfung-entwurf/StructureDefinition/ps-immunization-medication"

[informationsmodell]
art = "mio-baum"
# Informationsmodell der ePA Patient Summary (öffentlicher CI-Build), gesichert im Projekt epa-patient-summary
quelle = "../epa-patient-summary/quellen/infomodell_js_treeview_epa-ps.json"
teilbaum = "Profile / ePA ePS Profile (in Erarbeitung) / Impfung"
# Unter Knoten, die ein ganzes Profil abbilden, die Must-Support-Elemente des Entwurfs ohne Modellknoten ergänzen
profil_ergaenzen = true
hinweis = "Teilbaum „Impfung“ aus dem Informationsmodell der ePA Patient Summary (CI-Build ePS-0.0.1). Das Modell selbst enthält keine FHIR-Mappings; die Zuordnung zu den Entwurfsprofilen ps-immunization und ps-immunization-medication steht als Mappingtabelle in dieser Projektkonfiguration. Elemente des Entwurfs ohne Knoten im Modell (z. B. identifier, primarySource, reportOrigin, recorded, Dosisnummer, PZN, Charge) zeigt die ausmodellierte Darstellung als „aus Profil“ — dort wäre das Modell nachzuziehen."

# Mappingtabelle Modell → Entwurf. `knoten`: Pfad im Teilbaum („ / “ zwischen den Namen, „ (Referenz)“ darf fehlen),
# `fhir`: Profilname und Elementpfad wie in den FHIR-Mappings eines gematik-Modells, `ohne_ziel`: bewusst ohne Ziel.
[[informationsmodell.mappings]]
knoten = "Impfung"
fhir = "PSImmunization"

[[informationsmodell.mappings]]
knoten = "Impfung / Status"
fhir = "PSImmunization.status"

[[informationsmodell.mappings]]
knoten = "Impfung / Zielerkrankung - Code/Bezeichnung"
fhir = "PSImmunization.protocolApplied.targetDisease"

[[informationsmodell.mappings]]
knoten = "Impfung / Zielerkrankung - Code/Bezeichnung / Code-Auswahl / SNOMED-CT-Code"
fhir = "PSImmunization.protocolApplied.targetDisease.coding"

[[informationsmodell.mappings]]
knoten = "Impfung / Zielerkrankung - Code/Bezeichnung / Code-Auswahl / Code aus einem Code-System"
ohne_ziel = "Der Entwurf sieht für die Zielerkrankung nur SNOMED CT vor."

[[informationsmodell.mappings]]
knoten = "Impfung / Zielerkrankung - Code/Bezeichnung / Bezeichnung"
fhir = "PSImmunization.protocolApplied.targetDisease.text"

[[informationsmodell.mappings]]
knoten = "Impfung / Impfstoff - Code/Bezeichnung"
fhir = "PSImmunization.vaccineCode"

[[informationsmodell.mappings]]
knoten = "Impfung / Impfstoff - Code/Bezeichnung / Code-Auswahl / SNOMED-CT-Code"
fhir = "PSImmunization.vaccineCode.coding:snomed"

[[informationsmodell.mappings]]
knoten = "Impfung / Impfstoff - Code/Bezeichnung / Code-Auswahl / Code aus einem Code-System"
ohne_ziel = "Der Entwurf sieht für den Impfstoff nur SNOMED CT vor (Slice snomed)."

[[informationsmodell.mappings]]
knoten = "Impfung / Impfstoff - Code/Bezeichnung / Bezeichnung"
fhir = "PSImmunization.vaccineCode.text"

[[informationsmodell.mappings]]
knoten = "Impfung / Verabreichtes Produkt"
fhir = "PSImmunization.extension:administeredProduct"

[[informationsmodell.mappings]]
knoten = "Impfung / Verabreichtes Produkt / Datentyp"
ohne_ziel = "Hilfsknoten des Modells für den Datentyp (CodeableReference), kein eigenes Element."

[[informationsmodell.mappings]]
knoten = "Impfung / Verabreichtes Produkt / Referenz / Arzneimittel (ePA Medication Service)"
fhir = "PSImmunizationMedication"

[[informationsmodell.mappings]]
knoten = "Impfung / Impfdatum"
fhir = "PSImmunization.occurrenceDateTime"

[[informationsmodell.mappings]]
knoten = "Impfung / Verantwortliche Einrichtung"
fhir = "PSImmunization.performer:administeringCentreOrHp.actor"

[[informationsmodell.mappings]]
knoten = "Impfung / Impfende Person/Einrichtung"
fhir = "PSImmunization.performer:administeringCentreOrHp.actor"

[[informationsmodell.mappings]]
knoten = "Impfung / Notiz"
fhir = "PSImmunization.note"

[[informationsmodell.mappings]]
knoten = "Impfung / Notiz / Autor:in"
fhir = "PSImmunization.note.author[x]"

[[informationsmodell.mappings]]
knoten = "Impfung / Notiz / Zeitpunkt der Erstellung"
fhir = "PSImmunization.note.time"

[[informationsmodell.mappings]]
knoten = "Impfung / Notiz / Text"
fhir = "PSImmunization.note.text"

[[beispiele]]
id = "erstdokumentation"
titel = "Erstdokumentation — zwei Impfungen, Mustermann"
zweck = "Zwei Impfungen in der Praxis dokumentiert (primarySource = true): Influenza und Auffrischung Tetanus-Diphtherie-Pertussis-Polio, je mit SNOMED-Impfstoff (Vaccines – IPS), Zielerkrankungen (IPS Target Diseases), Dosisnummer, impfender Person (performer.function AP) und verabreichtem Produkt als enthaltene Medication nach ps-immunization-medication (PZN, Handelsname, Charge)."
herkunft = "Für dieses Projekt erstellt, Gerüst aus dem Beispiel patient-summary/yildiz. Fiktive Daten; PZN, Chargen und Handelsnamen sind erfunden."
datei = "beispiele/erstdokumentation.json"

[[beispiele]]
id = "nachtrag-impfpass"
titel = "Nachtrag aus einem Papier-Impfpass — Mustermann"
zweck = "Zwei nachgetragene Impfungen (primarySource = false, reportOrigin record „Papier-Impfpass“): ein historischer Kombinationsimpfstoff nur als Text mit unbekannter Dosisnummer (doseNumberString mit data-absent-reason unknown) und eine Influenza-Impfung mit SNOMED-Code, das Produkt laut Etikett als enthaltene Medication ohne PZN."
herkunft = "Für dieses Projekt erstellt, Gerüst aus dem Beispiel patient-summary/yildiz. Fiktive Daten."
datei = "beispiele/nachtrag-impfpass.json"

[validierung]
pakete = [
  "hl7.fhir.uv.extensions.r4#5.3.0",
  "de.basisprofil.r4#1.6.0",
  "hl7.fhir.eu.base#2.0.1",
  "hl7.fhir.uv.ips#2.0.1",
  "de.gematik.ti#1.5.0-ballot.2",
  "de.gematik.epa#1.4.0-ballot.1",
  "de.gematik.terminology#1.1.0-ballot.2",
  "hl7.fhir.eu.eps#1.0.0-ballot",
]

# Werkzeuggrenze, kein Fehler des Entwurfs: die Querversions-Extension administeredProduct (R5 CodeableReference,
# hl7.fhir.uv.xver-r5.r4#0.1.0) verlangt die Teil-Extension _datatype; der HL7 Validator 7.0.1 lehnt sie in R4 ab.
[[validierung.ausnahmen]]
id = "xver-datatype-kontext"
muster = "The extension http://hl7\\.org/fhir/StructureDefinition/_datatype v5\\.[0-9.]+ is not allowed to be used at this point"
grund = "Werkzeuggrenze: Die Querversions-Extension administeredProduct (hl7.fhir.uv.xver-r5.r4 0.1.0) verlangt die Teil-Extension _datatype (1..1, Wert CodeableReference). Deren Kontext ist in hl7.fhir.uv.extensions.r4 5.2.0 und 5.3.0 als Element „Base“ angegeben, das es in R4 nicht gibt; der HL7 Validator 7.0.1 lehnt _datatype deshalb an jeder Stelle ab. Ohne _datatype fehlt ein Pflicht-Slice. Gegenprobe ohne administeredProduct: keine Fehler."

[[validierung.ausnahmen]]
id = "xver-datatype-folgefehler"
muster = "section\\[\\d+\\]\\.entry\\[\\d+\\]: Unable to find a profile match for Immunization/imm-[a-z-]+ among choices: http://hl7\\.eu/fhir/base/StructureDefinition/immunization-eu-core$|^Bundle: Slice 'Bundle\\.entry:composition': a matching slice is required, but not found"
grund = "Folgefehler von xver-datatype-kontext: Der Abschnitt Impfungen der EPS-Composition prüft seine Einträge gegen immunization-eu-core; eine Impfung mit administeredProduct scheitert dort nur an _datatype, daraufhin passt die Composition nicht auf den Pflicht-Slice des Bundles. Die Impfungen selbst werden über meta.profile vollständig geprüft; ihre eigenen Meldungen bleiben sichtbar."
