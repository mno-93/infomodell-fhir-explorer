# European Patient Summary (HL7 Europe, Ballot) — ohne veröffentlichtes Informationsmodell mit FHIR-Mappings
id = "patient-summary"
titel = "Patient Summary (EU EPS)"
beschreibung = "Europäische Patient Summary: Struktur aus den Profilen abgeleitet (Composition, Abschnitte, Einträge), Beispiele aus dem Demo-PVS mit ePA-Medikation, Anwenderansicht und Erzähltext."
darstellung = "dokument"
dokumente = ["erzaehltext"]

pakete = [
  "hl7.fhir.eu.eps#1.0.0-ballot",
  "hl7.fhir.eu.base#2.0.0",
  "hl7.fhir.uv.ips#2.0.0",
  "hl7.fhir.eu.extensions.r4#1.3.0",
  "hl7.fhir.uv.xver-r5.r4#0.1.0",
  "hl7.fhir.uv.extensions.r4#5.3.0",
  "de.gematik.epa.medication#1.3.5",
  "de.gematik.epa#1.3.2",
  "de.gematik.ti#1.3.1",
  "de.basisprofil.r4#1.5.4",
  "hl7.fhir.r4.core#4.0.1",
]

# Nur für die Auflösung von Wertelisten der Bindungen
terminologiepakete = [
  "hl7.terminology.r4#7.1.0",
]

[ig]
name = "HL7 Europe Patient Summary"
paket = "hl7.fhir.eu.eps#1.0.0-ballot"
status = "Ballot"
url = "https://hl7.eu/fhir/eps/1.0.0-ballot/"
kanonisch = "http://hl7.eu/fhir/eps/"

# Einträge ohne meta.profile: Zielprofil des jeweiligen Abschnitts der EPS-Composition (Eintrags-Slices)
[standardprofile]
Condition = "http://hl7.eu/fhir/base/StructureDefinition/condition-eu-core"
AllergyIntolerance = "http://hl7.eu/fhir/base/StructureDefinition/allergyIntolerance-eu-core"
Procedure = "http://hl7.eu/fhir/eps/StructureDefinition/procedure-eu-eps"
Device = "http://hl7.eu/fhir/eps/StructureDefinition/device-eu-eps"
DeviceUseStatement = "http://hl7.eu/fhir/eps/StructureDefinition/deviceUseStatement-eu-eps"
Organization = "http://hl7.eu/fhir/base/StructureDefinition/organization-eu-core"

[informationsmodell]
art = "aus-profilen"
einstieg = "http://hl7.eu/fhir/eps/StructureDefinition/composition-eu-eps"
tiefe = 3
hinweis = "Für die EU Patient Summary ist kein Informationsmodell mit FHIR-Mappings veröffentlicht; die Xt-EHR-Logikmodelle 1.0.0 enthalten keine Mappings auf FHIR. Die Struktur folgt deshalb den Profilen: Pflicht- und Must-Support-Elemente bis zur dritten Ebene."

[[beispiele]]
id = "hoffmann"
titel = "Patient Summary — Hoffmann"
zweck = "Gefüllte Patient Summary: acht Abschnitte, Allergien, Diagnosen, Medikation aus der ePA, Laborwerte, Impfungen, Prozeduren, Implantat; je Abschnitt ein Erzähltext."
herkunft = "Demo-PVS (github.com/mno-93/demo-pvs, Commit d0e9615), erzeugt aus dem Datenbestand der Demo; HL7-Validator 7.0.1 gegen hl7.fhir.eu.eps#1.0.0-ballot. Fiktive Daten."
datei = "beispiele/hoffmann.json"

[[beispiele]]
id = "yildiz"
titel = "Patient Summary — Yildiz"
zweck = "Dünn besetzte Patient Summary: leere Abschnitte mit Erzähltext — zeigt, wie Leerstellen im Dokument erscheinen."
herkunft = "Demo-PVS (github.com/mno-93/demo-pvs, Commit d0e9615). Fiktive Daten."
datei = "beispiele/yildiz.json"

[validierung]
pakete = [
  "hl7.fhir.uv.extensions.r4#5.3.0",
  "de.basisprofil.r4#1.6.0",
  "hl7.fhir.eu.base#2.0.1",
  "de.gematik.ti#1.5.0-ballot.2",
  "de.gematik.epa#1.3.2",
  "de.gematik.epa.medication#1.3.5",
  "de.gematik.terminology#1.1.0-ballot.2",
  "hl7.fhir.eu.eps#1.0.0-ballot",
]
erweiterungen = ["https://example.org/"]

[[validierung.ausnahmen]]
id = "provenance-versionsverweis"
muster = "Provenance/[^']*' isn't reachable|Can't find '[A-Za-z]+/[^']+/_history/"
grund = "Die Beispiele tragen Änderungseinträge früherer Fassungen (Provenance mit Versionsverweis) für die Herkunftszeile; im Dokument nicht auflösbar. Abbildung im Demo-PVS offen."
